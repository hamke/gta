    <script>
        const users = {
            'x': 'x'
        };

        const loginPage = document.getElementById('loginPage');
        const dashboardPage = document.getElementById('dashboardPage');
        const loginForm = document.getElementById('loginForm');
        const loginError = document.getElementById('loginError');
        // const userDisplay = document.getElementById('userDisplay');
        const logoutBtn = document.getElementById('logoutBtn');

        function showDashboard(username) {
            loginPage.classList.add('hidden');
            dashboardPage.classList.remove('hidden');
            // userDisplay.textContent = username;
            renderDashboard();
        }

        function showLogin() {
            loginPage.classList.remove('hidden');
            dashboardPage.classList.add('hidden');
            loginError.classList.add('hidden');
            loginForm.reset();
            document.getElementById('username').focus();
        }

        function renderDashboard(filterText = "") {
            const dashboard = document.getElementById('dashboard');
            dashboard.innerHTML = "";

            const lowerFilter = filterText.toLowerCase();

            const filteredServices = filterText
                ? services.filter(s => {
                    const inName = s.name.toLowerCase().includes(lowerFilter);
                    const inLinkKeys = Object.keys(s.links).some(linkKey =>
                        linkKey.toLowerCase().includes(lowerFilter)
                    );
                    return inName || inLinkKeys;
                })
                : services;

            const categories = [...new Set(filteredServices.map(s => s.category))];

            categories.forEach(category => {
                const section = document.createElement("section");
                section.className = "mb-12";

                const title = document.createElement("h2");
                title.className = "text-xl font-semibold mb-4";
                title.textContent = category;

                const grid = document.createElement("div");
                grid.className = "grid grid-cols-1 md:grid-cols-4 gap-3";

                filteredServices
                    .filter(s => s.category === category)
                    .forEach(service => {
                        const card = document.createElement("div");
                        card.className = "border p-4 rounded shadow hover:shadow-lg bg-white";

                        const h3 = document.createElement("h3");
                        h3.className = "text-lg font-bold mb-2";
                        h3.textContent = service.name;

                        card.appendChild(h3);

                        if (service.links.main) {
                            service.links.main.forEach(link => {
                                const mainDiv = document.createElement("div");
                                mainDiv.className = "main-link mb-2";

                                const a = document.createElement("a");
                                a.href = link[domainType];
                                a.textContent = service.id;
                                a.className = "text-blue-600 hover:underline text-sm inline-block";
                                a.target = "_blank";

                                mainDiv.appendChild(a);
                                card.appendChild(mainDiv);
                            });
                        }

                        const otherLinksDiv = document.createElement("div");
                        otherLinksDiv.className = "text-sm mt-1";

                        const otherLinkEntries = Object.entries(service.links).filter(([key]) => key !== "main");

                        const otherLinks = [];
                        otherLinkEntries.forEach(([linkType, links]) => {
                            links.forEach(link => {
                                otherLinks.push({
                                    text: linkType,
                                    href: link[domainType],
                                });
                            });
                        });

                        otherLinks.forEach((linkObj, idx) => {
                            const a = document.createElement("a");
                            a.href = linkObj.href;
                            a.textContent = linkObj.text;
                            a.className = "text-blue-600 hover:underline";
                            a.target = "_blank";
                            otherLinksDiv.appendChild(a);

                            if (idx < otherLinks.length - 1) {
                                otherLinksDiv.appendChild(document.createTextNode(" / "));
                            }
                        });

                        if (otherLinks.length > 0) {
                            card.appendChild(otherLinksDiv);
                        }

                        grid.appendChild(card);
                    });

                section.appendChild(title);
                section.appendChild(grid);
                dashboard.appendChild(section);
            });
        }

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            loginError.classList.add('hidden');
            if (!username || !password) {
                loginError.textContent = 'Please enter username and password.';
                loginError.classList.remove('hidden');
                return;
            }

            if (users[username] && users[username] === password) {
                sessionStorage.setItem('username', username);
                showDashboard(username);
            } else {
                loginError.textContent = 'Incorrect username or password.';
                loginError.classList.remove('hidden');
            }
        });

        logoutBtn.addEventListener('click', () => {
            sessionStorage.removeItem('username');
            showLogin();
        });

        window.addEventListener('load', () => {
            const username = sessionStorage.getItem('username');
            if (username) {
                showDashboard(username);
            } else {
                showLogin();
            }
        });

    </script>

        function toggleClearBtn() {

        });

            if (e.key === "Enter") {
                renderDashboard(searchInput.value);

            }
        });

        clearBtn.addEventListener("click", () => {
            searchInput.value = "";
            toggleClearBtn();
            renderDashboard();
            searchInput.focus();
        });

        toggleClearBtn();
        renderDashboard();

    <script>
        const menuButton = document.getElementById("menuButton");
        const menuIcon = document.getElementById("menuIcon");
        const closeIcon = document.getElementById("closeIcon");
        const offCanvasMenu = document.getElementById("offCanvasMenu");
        const overlay = document.getElementById("overlay");

        function openMenu() {
            offCanvasMenu.classList.remove("-translate-x-full");
            offCanvasMenu.setAttribute("aria-hidden", "false");
            overlay.classList.remove("opacity-0", "pointer-events-none");
            menuIcon.classList.add("hidden");
            closeIcon.classList.remove("hidden");
        }

        function closeMenu() {
            offCanvasMenu.classList.add("-translate-x-full");
            offCanvasMenu.setAttribute("aria-hidden", "true");
            overlay.classList.add("opacity-0", "pointer-events-none");
            menuIcon.classList.remove("hidden");
            closeIcon.classList.add("hidden");
        }

        menuButton.addEventListener("click", () => {
            const isOpen = !offCanvasMenu.classList.contains("-translate-x-full");
            if (isOpen) {
                closeMenu();
            } else {
                openMenu();
            }
        });

        overlay.addEventListener("click", closeMenu);
    </script>

    <script>
        const langBtn = document.getElementById("langBtn");
        const langMenu = document.getElementById("langMenu");
        const selectedLang = document.getElementById("selectedLang");

        langBtn.addEventListener("click", () => {
            const isHidden = langMenu.classList.contains("hidden");
            if (isHidden) {
                langMenu.classList.remove("hidden");
                langBtn.setAttribute("aria-expanded", "true");
            } else {
                langMenu.classList.add("hidden");
                langBtn.setAttribute("aria-expanded", "false");
            }
        });

        langMenu.querySelectorAll("button").forEach(btn => {
            btn.addEventListener("click", () => {
                const langCode = btn.getAttribute("data-lang");
                selectedLang.textContent = langCode;
                langMenu.classList.add("hidden");
                langBtn.setAttribute("aria-expanded", "false");

                console.log("Selected language:", langCode);
            });
        });

        document.addEventListener("click", (e) => {
            if (!langBtn.contains(e.target) && !langMenu.contains(e.target)) {
                langMenu.classList.add("hidden");
                langBtn.setAttribute("aria-expanded", "false");
            }
        });
    </script>

    <script>
        const scrollTopBtn = document.getElementById('scrollTopBtn');
        const scrollBottomBtn = document.getElementById('scrollBottomBtn');

        window.addEventListener('scroll', () => {

            const nearTop = window.scrollY <= 100;
            const nearBottom = window.innerHeight + window.scrollY >= document.body.offsetHeight - 100;

            if (window.scrollY > 100) {
                scrollTopBtn.classList.remove('hidden');
            } else {
                scrollTopBtn.classList.add('hidden');
            }

            if (nearBottom) {
                scrollBottomBtn.classList.add('hidden');
            } else {
                scrollBottomBtn.classList.remove('hidden');
            }
        });

        scrollTopBtn.classList.add('hidden');
        scrollBottomBtn.classList.add('hidden');

        scrollTopBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        scrollBottomBtn.addEventListener('click', () => {
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        });
    </script>

    <script>
        document.addEventListener("keydown", (e) => {
            if (e.key === "/" && !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) {

            }
        });
    </script>
